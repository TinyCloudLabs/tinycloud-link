name: Backup Sidecar Image

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/docker-image-backup.yml"
      - "Dockerfile.backup"
      - "scripts/link-backup.sh"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/docker-image-backup.yml"
      - "Dockerfile.backup"
      - "scripts/link-backup.sh"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build Backup Sidecar Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image
        id: image
        uses: docker/build-push-action@v6
        env:
          BUILDX_METADATA_PROVENANCE: disabled
        with:
          context: .
          file: Dockerfile.backup
          provenance: false
          platforms: linux/amd64
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: |
            ghcr.io/tinycloudlabs/tinycloud-link-backup:${{ github.sha }}

      # LINK_BACKUP_IMAGE in the CVM's sealed env is this immutable reference, not a tag.
      - name: Record immutable image digest
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          digest="${{ steps.image.outputs.digest }}"
          [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]
          echo "Published immutable backup image (LINK_BACKUP_IMAGE): ghcr.io/tinycloudlabs/tinycloud-link-backup@${digest}" >> "$GITHUB_STEP_SUMMARY"
